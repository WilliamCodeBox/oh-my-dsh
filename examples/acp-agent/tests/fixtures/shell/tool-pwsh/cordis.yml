# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@williamcodebox/omd-system-prompt'

- id: tools
  name: '@williamcodebox/omd-tools'

- id: subprocess
  name: '@williamcodebox/omd-subprocess-local'

- id: bash
  name: '@williamcodebox/omd-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@williamcodebox/omd-shell-env'

- id: tasks
  name: '@williamcodebox/omd-jobs-local'

- id: tool-jobs
  name: '@williamcodebox/omd-tool-jobs'

- id: tool-pwsh
  name: '@williamcodebox/omd-tool-pwsh'
