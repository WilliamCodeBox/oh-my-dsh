# Exercise the model-facing LSP tool through the shipped ACP app and Loader entry path.
# The scenario workspace supplies the deterministic stdio server used by this test composition.
- id: base
  name: '@williamcodebox/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - insert:
          - id: lsp
            name: '@williamcodebox/omd-lsp'
          - id: lsp-stdio
            name: '@williamcodebox/omd-lsp-stdio'
            config:
              servers:
                fixture:
                  command: !!js process.execPath
                  args: ['./lsp-server.mjs']
                  extensionToLanguage:
                    '.ts': typescript
          - id: timeout-policy
            name: '@williamcodebox/omd-tool-call-timeout-policy'
          - id: tool-lsp
            name: '@williamcodebox/omd-tool-lsp'
            config:
              maxLocations: 1
