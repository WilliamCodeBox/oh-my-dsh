# Build the omd distribution folder (bun runtime + deployed closure tree)
# per Linux architecture and upload it as a build artifact. The tarball runs
# on CentOS 7+ (bun links only GLIBC_2.17 symbols); arm64 is built on
# GitHub's arm64 runner.
name: Omd Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - 'omd-v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library artifacts
        run: pnpm run build:lib

      - name: Assemble omd distribution
        run: pnpm run build:dist -- --bun "$(which bun)" --out omd-dist-${{ matrix.arch }}.tar.gz

      - name: Verify tarball
        run: |
          mkdir -p /tmp/verify && tar xzf omd-dist-${{ matrix.arch }}.tar.gz -C /tmp/verify
          DSH_HOME=/tmp/vhome /tmp/verify/omd --version
          # Assert the launcher reports the tagged version: a bump that
          # misses the version source (e.g. apps/cli) otherwise passes
          # release silently.
          VERSION="${GITHUB_REF_NAME#omd-v}"
          ACTUAL="$(DSH_HOME=/tmp/vhome /tmp/verify/omd --version)"
          [ "$ACTUAL" = "$VERSION" ] || { echo "version mismatch: expected $VERSION, got $ACTUAL" >&2; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omd-dist-${{ matrix.arch }}
          path: omd-dist-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/omd-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: omd-dist-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/omd-dist-*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --notes "omd distribution tarballs — CentOS 7+ (GLIBC_2.17). Install: curl -fsSL https://raw.githubusercontent.com/WilliamCodeBox/oh-my-dsh/main/install.sh | sh"
